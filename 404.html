<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Page not found · AimLabs</title>
  <link rel="icon" href="/assets/favicon.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="/styles/tokens.css" />
  <link rel="stylesheet" href="/styles/base.css" />
  <link rel="stylesheet" href="/styles/components.css" />
  <style>
    body { overflow: auto; }
    .missing {
      min-height: 100dvh;
      display: grid;
      align-content: center;
      gap: var(--space-4);
      padding: var(--space-6) var(--inset);
      max-width: 640px;
    }
    .missing-code { font-size: var(--text-score); line-height: 1; color: var(--ink-3); }
    .missing h1 { font-size: var(--text-h2); }
    .missing p { color: var(--ink-2); max-width: 44ch; }
    .missing .btn { justify-self: start; margin-top: var(--space-2); text-decoration: none; }
  </style>
</head>
<body>
  <main class="missing">
    <span class="missing-code num" aria-hidden="true">404</span>
    <h1>This page missed.</h1>
    <p>The address does not match anything on this site. Check the link, or head back to the range.</p>
    <a class="btn btn-primary btn-lg" href="/">Back to the range</a>
  </main>
</body>
</html>
